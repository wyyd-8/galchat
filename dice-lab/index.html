<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#120f1b" />
    <title>Galchat · 多面骰实验室</title>
  </head>
  <body>
    <div id="app">
      <header class="hero">
        <p class="eyebrow">GALCHAT · DICE LAB</p>
        <h1>多面骰实验室</h1>
        <p class="intro">闭合多面体围绕自身中心旋转，最后让指定结果面朝向屏幕。</p>
      </header>

      <section class="controls" aria-label="掷骰控制">
        <button id="skin-button" type="button" aria-pressed="false">
          <span class="skin-icon" aria-hidden="true">✦</span>
          <span id="skin-label">经典皮肤</span>
        </button>
        <select id="demo-select" aria-label="选择后端返回示例">
          <option value="standard">全部标准骰</option>
          <option value="group">骰子组 3D6 + 2D8</option>
          <option value="percentile">双优势百分骰</option>
        </select>
        <button id="roll-button" type="button">
          <span class="button-icon" aria-hidden="true">◆</span>
          播放掷骰
        </button>
        <div class="result" aria-live="polite">
          <span class="result-label">结果</span>
          <strong id="result-values">—</strong>
          <span id="result-total">等待掷骰</span>
        </div>
      </section>

      <main id="scene" aria-label="多面骰演示区">
        <section class="dice-table" aria-label="多面骰掷骰区域">
          <div class="table-title">
            <span>FIXED CENTER ROTATION</span>
            <strong>THREE.JS · BAKED DICE SET</strong>
          </div>
          <div class="table-line"></div>
          <div id="dice-tray" class="dice-tray"></div>
          <p class="table-hint">中心位置固定 · 原地旋转 · 结果面朝向屏幕</p>
        </section>
      </main>

      <footer>
        <span>后端结构驱动</span>
        <span>D4 · D6 · D8 · D10 · D12 · D20 · D100</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
