services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-galchat}
      POSTGRES_USER: ${POSTGRES_USER:-galchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/test/java/com/me/galchat/init/console.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:latest}
    command: ["/bin/sh", "/usr/local/bin/init-ollama.sh"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./docker/ollama/init-ollama.sh:/usr/local/bin/init-ollama.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q \"$${OLLAMA_MODEL}\""]
      interval: 20s
      timeout: 10s
      retries: 20

  bert-service:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    restart: unless-stopped
    environment:
      BERT_HOST: 0.0.0.0
      BERT_PORT: 8081
    command: ["python", "/app/bert.py"]
    volumes:
      - bert-model-cache:/root/.cache
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/docs')\""]
      interval: 20s
      timeout: 10s
      retries: 10

  reranker-service:
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    restart: unless-stopped
    environment:
      RERANKER_HOST: 0.0.0.0
      RERANKER_PORT: 8082
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-BAAI/bge-reranker-v2-m3}
      HF_HOME: /models/huggingface
      TRANSFORMERS_CACHE: /models/huggingface
    command: ["python", "/app/reranker_server.py"]
    volumes:
      - huggingface-cache:/models/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/docs')\""]
      interval: 20s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
      bert-service:
        condition: service_healthy
      reranker-service:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-galchat}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-galchat}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 0
      SPRING_AI_OLLAMA_BASE_URL: http://ollama:11434
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_MODEL: ${OLLAMA_EMBEDDING_MODEL:-qwen3-embedding:latest}
      SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_DIMENSIONS: ${SPRING_AI_OLLAMA_EMBEDDING_OPTIONS_DIMENSIONS:-1024}
      SPRING_AI_DEEPSEEK_BASE_URL: ${SPRING_AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SPRING_AI_DEEPSEEK_API_KEY: ${SPRING_AI_DEEPSEEK_API_KEY:-}
      SPRING_AI_DEEPSEEK_CHAT_OPTIONS_MODEL: ${SPRING_AI_DEEPSEEK_CHAT_OPTIONS_MODEL:-deepseek-v4-flash}
      GALCHAT_BERT_URL: http://bert-service:8081
      GALCHAT_RERANKER_URL: http://reranker-service:8082
      GALCHAT_ALIOSS_ENDPOINT: ${GALCHAT_ALIOSS_ENDPOINT:-https://oss-cn-beijing.aliyuncs.com}
      GALCHAT_ALIOSS_BUCKET_NAME: ${GALCHAT_ALIOSS_BUCKET_NAME:-galchat}
      GALCHAT_ALIOSS_REGION: ${GALCHAT_ALIOSS_REGION:-cn-beijing}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  huggingface-cache:
  bert-model-cache:
