spring:
  application:
    name: galchat
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 4MB
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: sk-e32f5daaf4824926a76fea2f0d87b473
      chat:
        model: deepseek-v4-pro
        temperature: 1.0
    model:
      embedding: ollama
    ollama:
      embedding:
        model: bge-m3
  cache:
    type: redis
    # 不配置 cache-names 或留空，则任何 @Cacheable 新名称都会自动创建
    redis:
      time-to-live: 60m
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/postgres
    username: wyyd
    password:
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
logging:
  level:
    com.me.galchat:
      mapper: debug
      service: info
      controller: info
    org.springframework.ai.chat.client.advisor: debug
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      update-strategy: not_null
      id-type: auto
galchat:
  model-api:
    # 生产环境必须通过环境变量提供 Base64 编码的 32 字节主密钥。
    master-key: ${GALCHAT_MODEL_API_MASTER_KEY:}
    request-timeout: 30s
  alioss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: galchat
    region: cn-beijing
  aliemail:
    account-name: usercheck@galchat.top
    reply-to-address: false
